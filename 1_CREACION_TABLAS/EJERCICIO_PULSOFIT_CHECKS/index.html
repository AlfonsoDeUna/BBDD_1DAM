<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="color-scheme" content="light" />
<title>PulsoFit | Presentación guiada de restricciones CHECK · 1.º DAM</title>
<style>
:root{
  --blue:#2457c5; --green:#16803c; --red:#c83134;
  --ink:#14233a; --muted:#596a7f; --soft:#eef2f7; --line:#dbe3ef;
  --canvas:#eef3f9; --white:#ffffff; --accent:#264f9f;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--canvas);font-family:var(--font);color:var(--ink)}
button,select{font:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-rows:58px minmax(0,1fr) 66px;width:100%;height:100dvh}
.topbar{background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:18px;padding:0 22px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;white-space:nowrap}
.brand-badge{background:var(--accent);color:white;font-weight:800;letter-spacing:.05em;border-radius:8px;padding:7px 10px;font-size:13px}
.brand-text{font-size:14px;font-weight:700;color:#30445c}
.tools{display:flex;align-items:center;gap:9px;min-width:0}
.toc-label{font-size:12px;color:var(--muted);white-space:nowrap}
#toc{max-width:250px;min-width:175px;border:1px solid #cbd5e2;background:#fff;border-radius:8px;padding:7px 9px;color:#1b334f;font-size:13px}
.tool-btn{background:#fff;color:#20354e;border:1px solid #cbd5e2;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.tool-btn:hover,.tool-btn:focus-visible{border-color:#547bc7;background:#f5f8ff}
.deck-stage{min-height:0;min-width:0;display:flex;align-items:center;justify-content:center;padding:14px;overflow:hidden}
.slide{
  display:none; flex-direction:column; flex-shrink:0;
  width:min(100%,calc((100dvh - 156px)*16/9),1400px);
  aspect-ratio:16/9;
  background:white;
  box-shadow:0 15px 40px rgba(23,44,78,.10);
  border:1px solid #e2e9f3;
  border-radius:14px;
  padding:2.6% 4% 2.2%;
  overflow:hidden;
}
.slide.active{display:flex}
.slide-top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:12px;flex-shrink:0}
.eyebrow{color:#526987;font-size:clamp(12px,1.06vw,16px);font-weight:800;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.phase{background:#f2f6fc;border:1px solid #e0e9f7;border-radius:24px;padding:6px 12px;color:#345eaa;font-size:clamp(12px,1.0vw,15px);font-weight:700;white-space:nowrap}
.ruleline{width:100%;height:2px;background:linear-gradient(90deg,#274d93 0%,#c8d7ed 55%,transparent 100%);flex-shrink:0;margin-bottom:12px}
.slide-main{display:flex;flex-direction:column;justify-content:center;flex:1;min-height:0;gap:18px}
.slide h1{font-size:clamp(28px,3.2vw,48px);font-weight:800;letter-spacing:-.035em;line-height:1.13;margin:0;color:#112743}
.slide h2{font-size:clamp(20px,2.1vw,30px);line-height:1.2;margin:0;font-weight:750}
.slide h3{font-size:clamp(17px,1.6vw,24px);margin:0;color:#19314e}
.slide p{margin:0}
.slide-tail{display:flex;justify-content:space-between;align-items:center;gap:20px;border-top:1px solid #edf1f6;padding-top:12px;margin-top:13px;color:var(--muted);font-size:clamp(12px,1vw,15px);flex-shrink:0}
.slide-tail .exercise-meta{font-weight:700;color:#55708e}
.statement{font-size:clamp(24px,2.65vw,42px);line-height:1.48;letter-spacing:-.012em;font-weight:500;max-width:1100px;color:#152a42}
.statement.centered{margin:auto 0}
.statement.long{font-size:clamp(22px,2.38vw,36px)}
.source-label{display:flex;gap:12px;flex-wrap:wrap;font-size:clamp(14px,1.16vw,18px);color:#5c6e84}
.source-label code{background:#f2f5fa;border:1px solid #e4eaf2;border-radius:6px;padding:3px 7px;font:600 .96em var(--mono);color:#284664}
.source-label code.ref-table{color:var(--blue)}
.source-label code.ref-check{color:var(--green)}
.context-note{font-size:clamp(16px,1.37vw,21px);color:var(--muted);line-height:1.42;max-width:1060px}
.mark{border-radius:2px;text-decoration-line:underline;text-decoration-style:solid;text-decoration-thickness:.16em;text-underline-offset:.21em;font-weight:700}
.mark.b{color:#194cbb;text-decoration-color:var(--blue)}
.mark.g{color:#117437;text-decoration-color:var(--green)}
.mark.r{color:#bd292d;text-decoration-color:var(--red)}
.legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:clamp(13px,1.16vw,18px)}
.legend span{padding:4px 7px;border-radius:5px}
.legend .legend-b{color:var(--blue);border-bottom:3px solid var(--blue)}
.legend .legend-g{color:var(--green);border-bottom:3px solid var(--green)}
.legend .legend-r{color:var(--red);border-bottom:3px solid var(--red)}
.think-box{background:#f5f8fe;border-left:5px solid #557bc2;border-radius:10px;padding:18px 22px;font-size:clamp(18px,1.62vw,25px);line-height:1.45;max-width:1050px}
.think-box strong{color:#284f9b}
.small-cap{font-size:clamp(13px,1.10vw,17px);letter-spacing:.07em;font-weight:800;text-transform:uppercase;color:#5c7190}
.visual{border:1px solid #dce5f1;background:#fbfdff;border-radius:14px;padding:20px 24px;min-height:225px;display:flex;flex-direction:column;gap:12px;justify-content:center}
.v-root{text-align:center;align-self:center;border:1.5px solid #94abc9;border-radius:9px;background:#fff;padding:9px 23px;font-weight:750;font-size:clamp(16px,1.45vw,22px);box-shadow:0 2px 0 #e8eef7}
.v-down{height:22px;align-self:center;width:2px;background:#8ca2bf;position:relative}
.v-down:after{content:"";position:absolute;bottom:-1px;left:-5px;border:6px solid transparent;border-top-color:#8ca2bf;transform:translateY(5px)}
.nodes{display:flex;gap:13px;align-items:stretch;width:100%;justify-content:center}
.node{min-width:0;flex:1;text-align:center;background:#fff;border:2px solid #bed0e7;border-radius:10px;padding:12px 10px;display:flex;flex-direction:column;justify-content:center;gap:8px;min-height:105px}
.node.new{border-color:#6d9bcc;background:#eff5fe;box-shadow:0 0 0 3px rgba(50,113,207,.06)}
.node.pending{border-style:dashed;background:#fafcff;color:#7c8899}
.node-title{font-weight:750;color:#4a607c;font-size:clamp(13px,1.2vw,18px)}
.node-code{font:750 clamp(14px,1.46vw,22px)/1.35 var(--mono);overflow-wrap:anywhere;color:#183759}
.node.pending .node-code{color:#8393a8}
.joiner{display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#6380a5;font-weight:800;font-size:clamp(13px,1.13vw,17px);min-width:34px}
.summary-expression{border-radius:9px;background:#ebf3ff;border:1px solid #bbd1f3;text-align:center;color:#1a438b;font-family:var(--mono);font-size:clamp(14px,1.6vw,23px);font-weight:700;padding:10px 16px;overflow-wrap:anywhere}
.summary-expression.pending{background:#f9fbfd;border:1px dashed #c6d3e3;color:#71849c}
.group-visual{border:1px solid #c2d4eb;border-radius:10px;padding:12px;background:#f5f9fe}
.group-heading{text-align:center;font-size:clamp(13px,1.06vw,16px);font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:#456ea7;margin-bottom:9px}
.group-arrow{text-align:center;font-weight:900;color:#6685b1;font-size:24px}
.postal-visual{padding:12px 16px;gap:9px;min-height:0}
.postal-visual .group-visual{padding:10px 13px}
.postal-visual .node{min-height:75px;padding:7px 8px}
.postal-visual .node-title{font-size:clamp(12px,1.1vw,16px)}
.postal-visual .node-code{font-size:clamp(13px,1.35vw,19px)}
.postal-visual .group-heading{margin-bottom:5px}
.postal-row{display:grid;grid-template-columns:minmax(170px,.6fr) minmax(0,1.4fr);gap:12px;align-items:stretch}
.postal-tail{border:1.5px solid #c2d4eb;border-radius:9px;display:flex;align-items:center;justify-content:center;gap:14px;padding:10px;color:#244c83;background:#f4f8ff;font-size:clamp(14px,1.46vw,21px)}
.postal-tail b{font-family:var(--mono)}
.postal-tail.pending{border-style:dashed;color:#8091a7;background:#fff}
.postal-visual .summary-expression{font-size:clamp(13px,1.35vw,18px);display:flex;justify-content:center;align-items:center}

.branch-root{margin:0 auto;border:2px solid #88a7cb;background:#fff;padding:12px 19px;border-radius:12px;text-align:center;font-weight:750;max-width:500px}
.branch-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px}
.branch-card{border:2px solid #c4d3e6;border-radius:11px;padding:16px;background:#fff;text-align:center;min-height:105px}
.branch-card.pending{border-style:dashed;color:#93a3b5;background:#fbfdff}
.branch-card .branch-tag{font-weight:850;color:#2c6f49;font-size:clamp(14px,1.2vw,18px);margin-bottom:7px}
.branch-card .branch-code{font:700 clamp(14px,1.38vw,21px) var(--mono);overflow-wrap:anywhere}
.code-card{background:#13263d;color:#f0f6fd;border:1px solid #1d3b60;border-radius:13px;overflow:hidden;box-shadow:0 6px 12px rgba(17,39,66,.08)}
.code-head{background:#1d3551;border-bottom:1px solid #395574;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 17px;font-size:clamp(12px,1.1vw,16px);color:#dcecff;font-weight:700}
.code-status{color:#fbd38b;font-weight:800;font-size:.9em}
.code-status.complete{color:#b7f6d5}
pre,code{font-family:var(--mono)}
.code-card pre{margin:0;padding:20px 25px;white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal;line-height:1.59;font-size:clamp(15px,1.56vw,23px);tab-size:4}
.code-card .new-code{background:#33597e;outline:3px solid rgba(92,155,223,.25);border-radius:3px;color:#fff1a6;font-weight:800}
.code-card .placeholder{color:#e9c6ad}
.code-card .sql-check{color:#78e4a3;font-weight:760}
.code-sentence{font-size:clamp(17px,1.50vw,22px);color:#385273;line-height:1.38}
.solution-note{font-size:clamp(14px,1.19vw,18px);color:#55708e}
.check-panel{display:grid;grid-template-columns:1.4fr .7fr;gap:20px;align-items:stretch}
.question-card{border:1.5px solid #b6cbe8;border-radius:13px;background:#f8fbff;padding:26px 28px;display:flex;flex-direction:column;justify-content:center;gap:13px}
.question-card .qmark{width:48px;height:48px;border:2px solid #5880c1;border-radius:50%;display:grid;place-items:center;font-size:28px;font-weight:900;color:#3c6bb2}
.question-text{font-size:clamp(22px,2.14vw,33px);line-height:1.3;font-weight:700}
.quiet-card{border:1px dashed #b9c8da;border-radius:13px;padding:24px;display:flex;flex-direction:column;justify-content:center;gap:9px;background:#fff}
.quiet-card b{font-size:clamp(16px,1.4vw,21px);color:#39597d}
.quiet-card p{font-size:clamp(15px,1.28vw,19px);line-height:1.45;color:#5d7087}
.answer-card{background:#f1f9f4;border:1.5px solid #b2dec1;border-radius:13px;padding:23px 27px;display:flex;flex-direction:column;gap:13px}
.answer-card .answer{font-size:clamp(20px,1.95vw,29px);font-weight:670;color:#20593a;line-height:1.4}
.error-card{border:1px solid #e9d5aa;background:#fffaf0;border-radius:10px;padding:16px 20px;color:#79511e;font-size:clamp(16px,1.35vw,20px);line-height:1.42}
.exercise-start{display:flex;flex-direction:column;gap:26px}
.challenge-flag{display:inline-flex;align-items:center;gap:8px;width:fit-content;background:#eef5fc;border-radius:999px;color:#3a5b88;padding:8px 12px;font-weight:800;font-size:clamp(14px,1.18vw,18px)}
.level-high{color:#3c688e}
.cover{display:flex;flex-direction:column;gap:18px;justify-content:center}
.cover .overline{font-size:clamp(16px,1.38vw,21px);text-transform:uppercase;letter-spacing:.13em;font-weight:800;color:#4771af}
.cover h1{font-size:clamp(40px,4.85vw,76px);line-height:1.07;max-width:980px}
.cover .subtitle{font-size:clamp(21px,2.1vw,32px);color:#54708d;max-width:1000px;line-height:1.35}
.cover .tags{display:flex;flex-wrap:wrap;gap:10px;margin-top:7px}
.cover .tags span{background:#f0f5fc;color:#355881;border:1px solid #d5e2f4;padding:8px 13px;border-radius:50px;font-size:clamp(14px,1.19vw,18px);font-weight:650}
.pill-row{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1px solid #c7d7ed;background:#f5f8fd;border-radius:8px;padding:13px 15px;font-size:clamp(15px,1.55vw,22px);font-weight:750;color:#31598c}
.arrow-inline{font-size:24px;color:#8ba5c7;font-weight:900;align-self:center}
.two-col{display:grid;grid-template-columns:1.1fr .8fr;gap:20px;align-items:center}
.schema-code{font:clamp(12px,1.23vw,18px)/1.44 var(--mono);background:#12283e;color:#eff7ff;border-radius:12px;padding:17px 19px;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.schema-aside{border:1px solid #d4e0f0;border-radius:12px;padding:18px;background:#f5f9ff;color:#3b5779;font-size:clamp(17px,1.57vw,23px);line-height:1.47}
.schema-aside b{color:#284b7a}
.mini-list{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mini{background:#f6f9fe;border:1px solid #d9e4f3;border-radius:10px;text-align:center;padding:16px 12px;font-size:clamp(16px,1.4vw,22px);font-weight:650}
.autonomous{border:2px solid #c8d6e8;border-radius:13px;background:#fbfdff;padding:28px 30px;display:flex;flex-direction:column;justify-content:center;gap:13px;min-height:250px}
.autonomous .go{font-size:clamp(25px,2.4vw,37px);font-weight:800;color:#294d84}
.autonomous .body{font-size:clamp(18px,1.7vw,25px);line-height:1.45;color:#4c647c}
.space{height:50px;border-bottom:1px dashed #d9e1eb}
.deck-nav{background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;gap:20px;padding:0 24px}
.nav-button{background:#f6f9fe;color:#294d80;border:1px solid #c9d8eb;padding:10px 19px;border-radius:9px;font-size:14px;font-weight:800;white-space:nowrap}
.nav-button.primary{background:#2757ad;color:#fff;border-color:#2757ad}
.nav-button:hover:not(:disabled){filter:brightness(.97)}
.nav-button:disabled{opacity:.35;cursor:default}
.progress-wrap{flex:1;display:flex;align-items:center;gap:14px;min-width:0}
.progress-rail{height:7px;background:#dfe8f4;border-radius:10px;flex:1;overflow:hidden}
#progressFill{width:0;background:#4574bd;height:100%;border-radius:10px;transition:width .08s linear}
#counter{white-space:nowrap;font:750 13px var(--mono);color:#4c688b;min-width:77px;text-align:right}
#slideLabel{font-size:13px;color:#58708c;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.keyboard-tip{position:fixed;right:12px;bottom:74px;color:#7890aa;font-size:11px;pointer-events:none}
:focus-visible{outline:3px solid #7eacff;outline-offset:3px}
@media(max-width:1050px){.brand-text{display:none}.tools{gap:6px}.toc-label{display:none}#toc{min-width:140px;max-width:190px}.slide{padding:2.8% 4.2% 2.5%}.slide-main{gap:11px}.visual{min-height:185px;padding:13px 18px}.node{min-height:82px;padding:10px 8px}.code-card pre{padding:16px 20px}}
@media(max-height:660px) and (min-width:701px){.slide-main{gap:11px}.slide-top{margin-bottom:8px}.ruleline{margin-bottom:8px}.slide h1{font-size:clamp(26px,2.85vw,40px)}.visual{min-height:165px;padding:11px 15px}.node{min-height:76px}.code-card pre{padding:13px 18px;line-height:1.43}.slide-tail{margin-top:8px;padding-top:8px}.statement{line-height:1.35}.cover{gap:14px}}
@media(max-width:700px){
 .app{grid-template-rows:56px minmax(0,1fr) 58px}
 .topbar{padding:0 8px}.tools{gap:5px} .tool-btn{font-size:12px;padding:7px 6px}
 .tool-btn span.longlabel{display:none} .brand-badge{font-size:11px;padding:6px 8px}
 #toc{min-width:90px;width:105px;max-width:105px;font-size:12px;padding:7px 4px}
 .deck-stage{padding:8px}
 .slide{width:100%;height:100%;max-height:none;aspect-ratio:auto;overflow-y:auto;padding:18px 20px;border-radius:10px}
 .slide-top{flex-wrap:wrap;justify-content:flex-start;gap:5px}
 .slide-top .eyebrow{white-space:normal;max-width:100%;font-size:11px}
 .slide-top .phase{margin-left:auto;font-size:11px;padding:4px 8px}
 .slide h1{font-size:clamp(24px,6vw,36px)} .slide h2{font-size:clamp(19px,5vw,28px)}
 .statement,.statement.long{font-size:clamp(20px,5.2vw,30px);line-height:1.43}
 .slide-main{flex:1 0 auto;justify-content:center;gap:20px}
 .slide-main>*{min-width:0;overflow-wrap:anywhere}
 .postal-row{grid-template-columns:1fr}
 .postal-visual .nodes{flex-wrap:wrap}
 .branch-grid{grid-template-columns:1fr}
 .check-panel>*{min-width:0}
 .answer-card,.visual,.autonomous{min-width:0;overflow-wrap:anywhere}
 .slide-tail{font-size:12px}
 .nodes{flex-wrap:wrap;gap:7px} .node{min-width:40%;min-height:80px}
 .joiner{min-width:10px;font-size:12px}
 .visual{padding:12px;min-height:190px}
 .code-card pre{font-size:clamp(12px,3.25vw,17px);padding:16px;line-height:1.55}
 .source-label{font-size:13px}
 .cover h1{font-size:clamp(32px,8vw,54px)} .cover .subtitle{font-size:20px}
 .check-panel,.two-col{grid-template-columns:1fr}
 .schema-aside{font-size:16px}
 .mini-list{grid-template-columns:1fr 1fr}
 .pill{font-size:13px;padding:10px}.arrow-inline{font-size:13px}
 .brand{gap:3px}.deck-nav{gap:6px;padding:0 8px}
 .nav-button{padding:9px;font-size:12px}
 #slideLabel,.keyboard-tip{display:none}#counter{font-size:11px;min-width:60px}
}
@media print{
 @page{size:A4 landscape;margin:9mm}
 html,body,.app,.deck-stage{width:100%!important;height:auto!important;overflow:visible!important;display:block!important;background:#fff!important}
 .topbar,.deck-nav,.keyboard-tip{display:none!important}
 .deck-stage{padding:0!important}
 .slide{display:flex!important;width:100%!important;height:184mm!important;max-height:none!important;aspect-ratio:auto!important;box-shadow:none!important;border:0!important;border-radius:0!important;margin:0!important;padding:14mm 16mm 11mm!important;overflow:hidden!important;break-after:page;page-break-after:always}
 .slide:last-child{break-after:auto;page-break-after:auto}
 .slide h1{font-size:32pt!important}.statement{font-size:23pt!important}.statement.long{font-size:22pt!important}
 .slide-main{justify-content:center}.code-card pre{font-size:15pt!important}
 .visual{min-height:100px}.node-code{font-size:15pt!important}
 body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand"><span class="brand-badge">PF</span><span class="brand-text">PulsoFit · CHECK paso a paso · 1.º DAM</span></div>
  <div class="tools">
    <label class="toc-label" for="toc">Índice</label>
    <select id="toc" aria-label="Ir a un ejercicio"><option value="0">Portada</option></select>
    <button class="tool-btn" id="fullscreenBtn" title="Pantalla completa">⛶ <span class="longlabel">Pantalla completa</span></button>
    <button class="tool-btn" id="printBtn" title="Imprimir todas las diapositivas">⎙ <span class="longlabel">Imprimir</span></button>
  </div>
</header>
<main class="deck-stage" id="deck" aria-label="Presentación de ejercicios PulsoFit"></main>
<footer class="deck-nav">
  <button class="nav-button" id="prevBtn" aria-label="Diapositiva anterior">← Anterior</button>
  <div class="progress-wrap">
    <span id="slideLabel"></span>
    <div class="progress-rail"><div id="progressFill"></div></div>
    <span id="counter" aria-live="polite">1 / 1</span>
  </div>
  <button class="nav-button primary" id="nextBtn" aria-label="Siguiente diapositiva">Siguiente →</button>
</footer>
</div>
<div class="keyboard-tip">Teclas: ← → · Inicio · Fin</div>
<script>
'use strict';
const EXERCISES = [
  {
    "n": 1,
    "title": "El código del socio",
    "statement": "En socios, codigo debe contener el prefijo PF- seguido de exactamente cuatro dígitos.",
    "table": "socios",
    "name": "chk_socios_codigo",
    "parts": [
      [
        "En ",
        ""
      ],

function diagNode(b,index,visible,markNew=false){
  let shown=index<visible;
  return `<div class="node ${shown?(markNew?'new':''):'pending'}"><div class="node-title">${escapeHTML(b.title)}</div><div class="node-code">${shown?escapeHTML(b.value):'¿ ... ?'}</div></div>`;
}
function genericVisual(e,visible){
  const full=visible>=e.blocks.length;
  const pieces=e.blocks.map((b,i)=>`${i?`<div class="joiner">${e.relation==='AND'?'Y':e.relation==='OR'?'O':e.relation==='IN'?'O':'+'}</div>`:''}${diagNode(b,i,visible,i===visible-1 || (full && visible-e.blocks.length>=0 && i>0 && visible!==1))}`).join('');
  let footer=full?escapeHTML(e.summary):'¿Qué expresión une todas las partes?';
  return `<div class="visual">
    <div class="v-root">${escapeHTML(e.table)} · ${escapeHTML(e.name)}</div>
    <div class="v-down"></div>
    <div class="nodes">${pieces}</div>
    <div class="v-down"></div>
    <div class="summary-expression ${full?'':'pending'}">${footer}</div>
  </div>`;
}
function postalVisual(e,visible){
  const full=visible>=4;

      <div class="summary-expression ${full?'':'pending'}">${full?escapeHTML(e.summary):'¿Cómo se unen las cuatro partes?'}</div>
    </div>
  </div>`;
}
function branchVisual(e,visible){

   return `<div class="visual">
     <div class="branch-root">¿El socio tiene la cuota ESTUDIANTE?</div>

     <div class="branch-grid">

}
function visual(e,visible){
 return e.diagramKind==='postal'?postalVisual(e,visible):e.diagramKind==='branches'?branchVisual(e,visible):genericVisual(e,visible);
}
function formatSQL(e,cond,focus){
 let decorated=escapeHTML(cond);
 if(focus){let j=cond.indexOf(focus);
   if(j>=0){decorated=escapeHTML(cond.slice(0,j))+`<span class="new-code">${escapeHTML(focus)}</span>`+escapeHTML(cond.slice(j+focus.length));}
 }
 return `<span>ALTER TABLE ${escapeHTML(e.table)}</span>\n    <span class="sql-check">ADD CONSTRAINT ${escapeHTML(e.name)}</span>\n    <span class="sql-check">CHECK</span> (\n        ${decorated}\n    );`;
}
function codePanel(e,step,isFinal){
 return `<div class="code-card"><div class="code-head"><span>SQL · ${escapeHTML(e.name)}</span><span class="code-status ${isFinal?'complete':''}">${isFinal?'SOLUCIÓN COMPLETA':'BORRADOR · NO EJECUTAR'}</span></div><pre><code>${formatSQL(e,step.condition,step.focus)}</code></pre></div>`;

     <div class="ruleline"></div>
     <div class="slide-main">${title}${s.body}</div>
     <div class="slide-tail"><span>${escapeHTML(s.note)}</span><span class="exercise-meta">${s.ex?`EJ. ${number(s.ex.n)} / 15`:'PULSOFIT'}</span></div>
   </section>`;
}
deck.innerHTML=slides.map(renderSlide).join('');
for(const e of EXERCISES){
 const opt=document.createElement('option');opt.value=String(starts.get(e.n));opt.textContent=`${number(e.n)} · ${e.title}`;toc.appendChild(opt);
}
const elements=[...deck.querySelectorAll('.slide')];
let current=0;
function jump(to){
 const next=Math.min(Math.max(0,Number(to)||0),slides.length-1);
 if(elements[current]){elements[current].classList.remove('active');elements[current].setAttribute('aria-hidden','true');}
 current=next;
 elements[current].classList.add('active');elements[current].setAttribute('aria-hidden','false');
 elements[current].scrollTop=0;
 const s=slides[current];
 document.getElementById('counter').textContent=`${current+1} / ${slides.length}`;
 document.getElementById('progressFill').style.width=`${((current+1)/slides.length)*100}%`;
 document.getElementById('slideLabel').textContent=s.ex?`Ejercicio ${number(s.ex.n)} · ${s.phase}`:s.phase;
 document.getElementById('prevBtn').disabled=current===0;
 document.getElementById('nextBtn').disabled=current===slides.length-1;
 let n=s.ex?s.ex.n:0;
 toc.value=String(n?starts.get(n):0);
}
document.getElementById('prevBtn').addEventListener('click',()=>jump(current-1));
document.getElementById('nextBtn').addEventListener('click',()=>jump(current+1));
toc.addEventListener('change',()=>{jump(Number(toc.value));toc.blur();});
document.addEventListener('keydown',event=>{
  if(event.altKey||event.ctrlKey||event.metaKey)return;
  const t=event.target;
  if(t && ['SELECT','INPUT','TEXTAREA'].includes(t.tagName))return;
  if(event.key==='ArrowRight'||event.key==='PageDown'||event.key===' '){event.preventDefault();jump(current+1)}
  else if(event.key==='ArrowLeft'||event.key==='PageUp'){event.preventDefault();jump(current-1)}
  else if(event.key==='Home'){event.preventDefault();jump(0)}
  else if(event.key==='End'){event.preventDefault();jump(slides.length-1)}
});
document.getElementById('fullscreenBtn').addEventListener('click',async()=>{
  try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen();}
  catch(e){alert('Este navegador no permite activar la pantalla completa desde esta página. Usa F11.');}
});
document.getElementById('printBtn').addEventListener('click',()=>window.print());
jump(0);
// Datos verificables para la revisión del profesor (no visibles en pantalla).
window.PULSOFIT_DECK_INFO={totalSlides:slides.length,exercises:EXERCISES.length,
  starts:Object.fromEntries(starts),slugs:EXERCISES.map(e=>e.name),lastSlide:slides.length-1};
</script>
</body>
</html>
